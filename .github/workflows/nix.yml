name: Manual fill-station OSPI build

on:
  workflow_dispatch:
    inputs:
      vehicle:
        description: Vehicle hardware profile
        type: choice
        required: true
        default: hybrid
        options:
          - hybrid
          - liquid

permissions:
  contents: read

jobs:
  build-ospi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build selected OSPI bundle with native x86 tools
        env:
          VEHICLE: ${{ inputs.vehicle }}
        run: |
          case "$VEHICLE" in
            hybrid) machine=fill-station ;;
            liquid) machine=fill-station-liquid ;;
            *) echo 'Unsupported vehicle profile' >&2; exit 1 ;;
          esac
          nix build --print-build-logs --no-write-lock-file --no-update-lock-file \
            --out-link result-ospi ".#mixosBuildConfigurations.\"x86_64-linux\".$machine.config.system.build.ospiImage"
          (cd result-ospi && sha256sum -c SHA256SUMS)
          mkdir release
          cp -L result-ospi/{tiboot3.bin,tispl.bin,u-boot.img,fitImage.itb,partitions,SHA256SUMS} release/
      - uses: actions/upload-artifact@v4
        with:
          name: fill-station-${{ inputs.vehicle }}-ospi
          path: release/
          if-no-files-found: error
          retention-days: 14
